<!DOCTYPE html>
<html>
    <head>
        <style>
            .highlight-border {
                border:5px green;
                border-radius:8px;
            }
            </style>
            </head>
            <body>
                <img id="myImage" src="jade.jpg" height="200" width="200" alt="sample is image">
                <br>
                <button id ="borderBtn">Toggle border</button>
                <script>
                    const btn = document.getElementById("borderBtn");
                    const img = document.getElementById("my image");
                    btn.addEventListener("click",function() {
                        img.classList.toggle("highlight-border");
                    });
                    </script>
                    </body>
